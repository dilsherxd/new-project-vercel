<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Our Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .card {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.3s ease;
        }

        .card:hover img {
            filter: brightness(0.7);
        }

        /* Play Button Overlay */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .play-btn svg {
            width: 35px;
            height: 35px;
            fill: #fff;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
            margin-left: 5px;
        }

        .card:hover .play-btn {
            background: rgba(255, 50, 50, 0.7);
            border-color: #fff;
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 0 40px rgba(255, 50, 50, 0.4);
        }

        /* Bottom label */
        .card-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 15px 15px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            color: #fff;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .card:hover .card-label {
            opacity: 1;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 2rem;
            }
            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 15px;
            }
            .play-btn {
                width: 55px;
                height: 55px;
            }
            .play-btn svg {
                width: 28px;
                height: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✦ Gallery ✦</h1>
        <p class="subtitle">Click any card to explore more</p>

        <div class="gallery" id="gallery">
            <!-- Cards will be injected via JS -->
        </div>

        <div class="footer">© 2026 — All rights reserved</div>
    </div>

    <script>
        const imageUrls = [
            'https://www.sigmapic.com/images/xxxsexpic.net/82/747_getting_getting.jpg',
            'https://www.sigmapic.com/images/xxxsexpic.net/192/971_mandy_love.jpg',
            'https://www.sigmapic.com/images/xxxsexpic.net/211/421_gets_her.jpg',
            'https://www.sigmapic.com/images/xxxsexpic.net/56/478_13_13.jpg'
        ];

        const redirectUrl = 'https://blog.outbacksteakmenu.us/top-5-multispecialty-hospitals-in-chennai/';

        const gallery = document.getElementById('gallery');

        imageUrls.forEach((url, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-index', index);

            // Image
            const img = document.createElement('img');
            img.src = url;
            img.alt = `Image ${index + 1}`;
            img.loading = 'lazy';

            // Play button (SVG)
            const playBtn = document.createElement('div');
            playBtn.className = 'play-btn';
            playBtn.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <polygon points="5,3 19,12 5,21" />
                </svg>
            `;

            // Label
            const label = document.createElement('div');
            label.className = 'card-label';
            label.textContent = `▶ Click to continue`;

            card.appendChild(img);
            card.appendChild(playBtn);
            card.appendChild(label);

            // Click → redirect
            card.addEventListener('click', () => {
                window.location.href = redirectUrl;
            });

            gallery.appendChild(card);
        });
    </script>

</body>
</html>
